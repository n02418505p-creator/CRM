name: tests
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEBUG: "true"
      COMPLAINTS_API_KEY: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test -v 2

  phones:
    runs-on: ubuntu-latest
    env:
      DEBUG: "true"
      COMPLAINTS_API_KEY: test
      MOBILE_SHOTS_DIR: ${{ github.workspace }}/mobile-shots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - name: Check every page at phone sizes
        run: python manage.py test complaints.tests_mobile -v 2
      - name: Publish screenshots to the mobile-screenshots branch
        if: always()
        run: |
          cd "$MOBILE_SHOTS_DIR" || exit 0
          git init -q -b mobile-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Phone screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" mobile-screenshots
